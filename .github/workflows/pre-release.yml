name: Publish to PyPI (test)

permissions:
  contents: read
  id-token: write

on:
  pull_request:
    branches:
      - "main"

jobs:
  pip-test:
    environment:
      name: pre-release
    runs-on: ubuntu-latest
    if: startsWith(github.event.pull_request.title, 'Release v')
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install Python
        run: uv python install 3.14
      - name: Build
        run: uv build
      - name: Read package version
        id: package
        run: echo "version=$(uvx hatch version)" >> "$GITHUB_OUTPUT"
      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl calliope --help
      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --with dist/*.tar.gz calliope --help
      - name: Publish on success
        run: uv publish --index testpypi --trusted-publishing always

      - name: Test successful publication
        run: >-
          uv run --with "calliope==${{ steps.package.outputs.version }}"
          --refresh-package calliope --index testpypi --no-project
          -- calliope --help
