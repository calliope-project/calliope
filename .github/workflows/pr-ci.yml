name: Pull Request CI

on:
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - LICENSE
      - CITATION
      - AUTHORS
      - docs/**
      - .readthedocs.yml
      - .pre-commit-config.yaml
      - mkdocs.yml

defaults:
  run:
    shell: bash -l {0}

concurrency:
  # Use github.run_id on main branch
  # Use github.event.pull_request.number on pull requests, so it's unique per pull request
  # Use github.ref on other branches, so it's unique per branch
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event.pull_request.draft == false
    strategy:
      matrix:
        os: [ubuntu-latest]
        py3version: ["11", "12", "13", "14"]
        include:
          - os: windows-latest
            py3version: "14"
          - os: macos-latest
            py3version: "14"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - uses: prefix-dev/setup-pixi@v0.9.6
      with:
        pixi-version: v0.70.2
        cache: true
        environments: ${{ format('py3{0}', matrix.py3version) }}
        manifest-path: pyproject.toml

    - name: Install jupyter kernel
      run: pixi run -e ${{ format('py3{0}', matrix.py3version) }} install-kernel

    - name: run tests with coverage
      if: matrix.os == 'ubuntu-latest' && matrix.py3version == '12'
      run: pixi run -e ${{ format('py3{0}', matrix.py3version) }} test-cov

    - name: run tests without coverage
      if: matrix.os != 'ubuntu-latest' || matrix.py3version != '12'
      run: pixi run -e ${{ format('py3{0}', matrix.py3version) }} test

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.os == 'ubuntu-latest' && matrix.py3version == '12'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
        directory: "./reports/coverage/"
        verbose: true
