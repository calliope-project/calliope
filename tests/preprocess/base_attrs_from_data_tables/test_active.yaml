# Variants for `TestBaseAttributesFromDataTables.test_active`.
# `expected` is the resulting value of `active` for `test_supply_elec` at each node.
#
# `data_table_dfs` are records loaded as in-memory dataframes, indexed over the `rows` of the data table that references them.
# `overrides` are applied as an override dictionary on the minimal test model.

node_tech_table:
  data_table_dfs:
    table_1:
      - {nodes: a, techs: test_supply_elec, active: false}
      - {nodes: b, techs: test_supply_elec, active: true}
  overrides:
    data_tables:
      table_1: {table: table_1, rows: [nodes, techs], columns: inputs}
  expected: {a: false, b: true}

tech_node_table:
  data_table_dfs:
    table_1:
      - {techs: test_supply_elec, nodes: a, active: false}
      - {techs: test_supply_elec, nodes: b, active: true}
  overrides:
    data_tables:
      table_1: {table: table_1, rows: [techs, nodes], columns: inputs}
  expected: {a: false, b: true}

node_tech_table_with_other_input:
  data_table_dfs:
    table_1:
      - {nodes: a, techs: test_supply_elec, active: false, flow_cap_max: 1}
      - {nodes: b, techs: test_supply_elec, flow_cap_max: 2}
  overrides:
    data_tables:
      table_1: {table: table_1, rows: [nodes, techs], columns: inputs}
  expected: {a: false, b: true}

